---
#Install system packages( Python, pip,venv,nginx,gunicorn)
- name: Install required packages (Ubuntu)
  become: yes
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - python3
    - python3-pip
    - python3-venv
    - nginx
  when: ansible_distribution == "Ubuntu"

- name: Install required packages (RHEL/CentOS)
  become: yes
  yum:
    name: "{{ item }}"
    state: present
  loop:
    - python3
    - python3-pip
    - python3-virtualenv
    - nginx
  when: ansible_distribution == "CentOS"

- name: create a virtual environment
  cammand:
    cmd: "python3 -m venv /opt/myapp/venv"
    creates: /opt/myapp/venv

- name: Install Flask and Gunicorn using python3-pip
  become: yes
  pip:
    name:
      - Flask
      - gunicorn
    executable: pip3
    python3-virtualenv: /opt/myapp/venv
  when: ansible_distribution in ["Ubuntu","CentOS"]

