---
- name: Import MongoDB public GPG key
  apt_key:
      url: https://www.mongodb.org/static/pgp/server-6.0.asc
      state: present   

- name: Add MongoDB repository
  apt_repository:
      repo: "deb [ arch=amd64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse"
      state: present    
        
- name: Update package list
  apt:
      update_cache: yes    
        
- name: Install MongoDB
  apt:
      name: mongodb-org
      state: present    
      
- name: Start and enable MongoDB service
  systemd:
      name: mongod
      state: started
      enabled: yes    
  
# Detect shell path: mongosh is the new default
- name: Check for mongosh
  stat:
    path: /usr/bin/mongosh
  register: mongosh_check

- name: Fail if mongosh is missing
  fail:
    msg: "mongosh shell not found! MongoDB shell required to seed the database."
  when: not mongosh_check.stat.exists

- name: Seed MongoDB with sample messages
  copy:
    dest: /tmp/seed.js
    content: |
      use securedb;
      if (db.messages.countDocuments() === 0) {
        db.messages.insertMany([
          { text: "Hello Team39!" },
          { text: "Your app is secured and verified." },
          { text: "Deployed using Ansible + Jenkins + Flask!" }
        ]);
      }

- name: Run seed script using mongosh
  shell: /usr/bin/mongosh /tmp/seed.js
  register: seed_script_result
  become: yes
  become_user: root
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Remove seed script only if it was successfully executed
  file:
    path: /tmp/seed.js
    state: absent
  when: seed_script_result.rc == 0

- name: Ping MongoDB
  command: /usr/bin/mongosh --eval "db.adminCommand('ping')"
  register: mongodb_ping
  changed_when: false
  failed_when: mongodb_ping.rc != 0

- name: Check seeded messages count
  command: /usr/bin/mongosh --eval "use securedb; db.messages.countDocuments()"
  register: mongodb_messages
  changed_when: false
  failed_when: mongodb_messages.rc != 0

- name: Show seeded message count
  debug:
    var: mongodb_messages.stdout_lines

- name: View MongoDB log tail
  command: tail -n 10 /var/log/mongodb/mongod.log
  register: mongodb_logs
  changed_when: false

- name: Debug seed script output
  debug:
    var: seed_script_result

- name: View MongoDB log tail
  command: tail -n 10 /var/log/mongodb/mongod.log
  register: mongodb_logs
  changed_when: false

- name: Show MongoDB log output
  debug:
    var: mongodb_logs.stdout_lines
