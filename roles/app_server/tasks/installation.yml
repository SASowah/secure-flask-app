- name: Install required packages (Ubuntu)
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - python3
    - python3-pip
    - gunicorn
    - nginx
  when: ansible_os_family == "Debian"

- name: Install required packages (RHEL/CentOS)
  yum:
    name: "{{ item }}"
    state: present
  loop:
    - python3
    - python3-pip
    - gunicorn
    - nginx
  when: ansible_os_family == "RedHat"

