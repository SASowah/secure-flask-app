---
- name: Import MongoDB public GPG key
  apt_key:
    url: https://www.mongodb.org/static/pgp/server-6.0.asc
    state: present

- name: Add MongoDB repository
  apt_repository:
    repo: "deb [ arch=amd64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse"
    state: present

- name: Update package list
  apt:
    update_cache: yes

- name: Install MongoDB
  apt:
    name: 
      - mongodb-org
      - mongodb-mongosh
    state: present

- name: Start and enable MongoDB service
  systemd:
    name: mongod
    state: started
    enabled: yes

- name: Wait for MongoDB to become available
  wait_for:
    port: 27017
    delay: 10
    timeout: 60

- name: Check for mongosh
  stat:
    path: /usr/bin/mongosh
  register: mongosh_check

- name: Fail if mongosh is missing
  fail:
    msg: "mongosh shell not found! Install mongosh to proceed."
  when: not mongosh_check.stat.exists

- name: Copy MongoDB seed script
  copy:
    src: src/init.db.js # Correct source path
    dest: /opt/flask_app/init.db.js        # Destination: /opt/flask_app/init.db.js

- name: Seed MongoDB with starter data
  shell: mongosh < /opt/flask_app/init.db.js
  register: seed_output
  changed_when: "'Added message' in seed_output.stdout"

- name: Ping MongoDB
  command: /usr/bin/mongosh --eval "db.adminCommand('ping')"
  register: mongodb_ping
  changed_when: false
  failed_when: mongodb_ping.rc != 0

- name: Verify document count
  command: /usr/bin/mongosh securedb --eval "db.messages.countDocuments()"
  register: doc_count
  changed_when: false

- name: Show document count
  debug:
    msg: "MongoDB documents: {{ doc_count.stdout }}"
