---
    # Existing app deployment tasks
    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Copy application files
      copy:
        src: "{{ playbook_dir }}/src/{{ item }}"
        dest: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      loop:
        - app.py
        - init.db.js
        - requirements.txt

    - name: Install Python dependencies
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        
# Step 1: Remove the default Nginx site
    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    # Step 2: Copy Nginx config from template
    - name: Create Nginx config for {{ domain }}
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/{{ domain }}

    # Step 3: Enable Nginx site for {{ domain }}
    - name: Enable Nginx site for {{ domain }}
      file:
        src: /etc/nginx/sites-available/{{ domain }}
        dest: /etc/nginx/sites-enabled/{{ domain }}
        state: link

    # Step 4: Check if the certificate exists for the domain
    - name: Check if certificate already exists
      stat:
        path: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
      register: cert

    # Step 5: Obtain SSL certificate with Certbot if it doesn't exist
    - name: Obtain SSL certificate with Certbot for {{ domain }}
      command: >
        certbot --nginx --non-interactive --agree-tos --redirect
        --email {{ certbot_email }}
        -d {{ domain }} -d www.{{ domain }}
      when: not cert.stat.exists
      register: certbot_result
      changed_when: "'Congratulations' in certbot_result.stdout"

    # Step 6: Restart Nginx to apply changes
    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted
    - name: Deploy systemd service for Flask
      template:
        src: flask_app.service.j2
        dest: /etc/systemd/system/flask_app.service
        notify: Restart Flask App