- name: Copy Gunicorn Service File
  template:
    src: gunicorn.service.j2
    dest: /etc/systemd/system/gunicorn.service
  notify: Restart Gunicorn

- name: Copy Nginx Config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: Restart Nginx

# New: Certbot SSL Configuration
- name: Create SSL directories
  file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  with_items:
    - /etc/ssl/private
    - /etc/ssl/certs
  become: yes

- name: Generate self-signed SSL private key
  openssl_privatekey:
    path: /etc/ssl/private/selfsigned.key
    size: 2048
    mode: 0600
  become: yes

- name: Create self-signed SSL certificate
  openssl_certificate:
    path: /etc/ssl/certs/selfsigned.crt
    privatekey_path: /etc/ssl/private/selfsigned.key
    common_name: "{{ ansible_default_ipv4.address }}"
    provider: selfsigned
    basic_constraints:
      - CA:FALSE
    key_usage:
      - digitalSignature
      - keyEncipherment
    subject_alt_name: "IP:{{ ansible_default_ipv4.address }}"
    valid_for: 365
  become: yes

- name: Set up periodic certificate renewal
  cron:
    name: "Regenerate Self-Signed Certificate"
    job: >
      openssl req -x509 -nodes -days 365 -new -key /etc/ssl/private/selfsigned.key 
      -out /etc/ssl/certs/selfsigned.crt 
      -subj "/CN={{ ansible_default_ipv4.address }}" 
      -addext "subjectAltName=IP:{{ ansible_default_ipv4.address }}"
    state: present
    special_time: monthly
  become: yes


- name: Ensure MongoDB config file exists
  stat:
    path: /etc/mongod.conf
  register: mongodb_conf

- name: Configure MongoDB to allow remote connections
  become: yes
  lineinfile:
    path: /etc/mongod.conf
    regexp: '^  bindIp: 127\.0\.0\.1'
    line: '  bindIp: 0.0.0.0'
    backrefs: yes
  when: mongodb_conf.stat.exists  # Only run if file exists
  notify: restart mongodb