---
- name: Install Python 3, pip, and virtualenv
  become: yes
  command: dnf install -y python3 python3-pip python3-virtualenv
  args:
    creates: /usr/bin/python3

- name: Install Python 3, pip, and virtualenv
  become: yes
  command: dnf install -y python3-pip
  

- name: Install Firewalld and Python firewall bindings
  become: yes
  command: dnf install -y firewalld python3-firewall
  args:
    creates: /usr/sbin/firewalld  # Runs only if Firewalld isn't installed

- name: Enable and Start Firewalld
  become: yes
  service:
    name: firewalld
    enabled: yes
    state: started

- name: Check current default firewall zone
  become: yes
  command: firewall-cmd --get-default-zone
  register: current_zone
  changed_when: false  # No "changed" status for this check

- name: Set default firewall zone to public
  become: yes
  command: firewall-cmd --set-default-zone=public
  when: current_zone.stdout != 'public'  # Idempotently set zone