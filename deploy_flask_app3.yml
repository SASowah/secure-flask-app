---
- name: Deploy Flask application
  hosts: app-server
  become: yes
  vars:
    app_user: ubuntu
    app_group: ubuntu
    app_dir: /opt/flask_app
    playbook_dir: "/home/ec2-user/secure-flask-app"

  tasks:
    # Existing app deployment tasks
    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Copy application files
      copy:
        src: "{{ playbook_dir }}/src/{{ item }}"
        dest: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      loop:
        - app.py
        - init.db.js
        - requirements.txt

    # Additional tasks for configuring Nginx with SSL
    - name: Install Certbot
      apt:
        name: certbot
        state: present
      become: yes

    - name: Generate SSL Certificates with Certbot
      command: >
        certbot certonly --standalone -d secureflask.duckdns.org
      register: certbot_output
      ignore_errors: yes
      failed_when: "'certbot' not in certbot_output.stderr"

    - name: Copy Nginx configuration
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Restart Nginx
      become: yes

    - name: Test Nginx configuration
      command: nginx -t
      become: yes
      failed_when: "'test is successful' not in result.stdout"

    - name: Restart Nginx to apply changes
      systemd:
        name: nginx
        state: restarted
      become: yes

    - name: Restart Gunicorn
      systemd:
        name: gunicorn
        state: restarted

    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart mongodb
      systemd:
        name: mongod
        state: restarted